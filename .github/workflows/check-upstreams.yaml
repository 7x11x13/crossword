name: Check upstreams from Cloudflare edge
on:
  push:
    branches: [diagnostic/upstream-edge-check]
    paths: [.github/diagnostics/**, .github/workflows/check-upstreams.yaml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - name: Build and validate updater
        run: |
          backend/node_modules/.bin/tsc --noEmit -p backend
          backend/node_modules/.bin/esbuild backend/scripts/update-polls.mjs --bundle --platform=node --format=esm --outfile=/tmp/update-polls.mjs
      - name: Validate missing polls without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node /tmp/update-polls.mjs --dry-run
