name: Check upstreams from Cloudflare edge
on:
  push:
    branches: [diagnostic/upstream-edge-check]
    paths: [.github/diagnostics/**, .github/workflows/check-upstreams.yaml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - name: Test deployed diagnostic Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          backend/node_modules/.bin/wrangler deploy --config .github/diagnostics/wrangler.jsonc
          sleep 10
          curl --fail-with-body --retry 3 --max-time 150 https://crossword-upstream-diagnostic.x7x11x13.workers.dev/ -o /tmp/results.json
          jq . /tmp/results.json
          {
            echo '### Deployed Cloudflare Worker upstream results'
            echo '```json'
            jq . /tmp/results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e 'length == 6 and all(.[]; .validMetadata == true or .validPoll == true)' /tmp/results.json
      - name: Remove diagnostic Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: backend/node_modules/.bin/wrangler delete --config .github/diagnostics/wrangler.jsonc --force
