name: Test backend
on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/test-backend.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx wrangler deploy --dry-run --outdir /tmp/crossword-build
